name: "DashClaw CodeQL config"

# graphify-pilot/ is a static source snapshot committed for the Graphify
# knowledge-graph tool (see graphify-pilot-scope-2026-04-06.md). It is not
# compiled by Next.js, not imported by anything, and not shipped — any findings
# inside it are literal duplicates of alerts that have already been triaged
# against the main `app/` tree. Excluding it here prevents CodeQL from
# re-flagging identical code on every scan.
paths-ignore:
  - graphify-pilot/**
