version: 1
project: layered-intelligence
policies:
  - id: graduated_autonomy_restrict_dangerous_tools
    description: "Graduated Autonomy — Restrict Dangerous Tools"
    policy_type: permission_escalation
    rules:
      enforce: true
    tests:
      - name: escalates_bash_for_workspace_write_agent
        input:
          tool: Bash
          agent_permission: workspace_write
          tool_permission: danger
        expect:
          decision: require_approval

      - name: allows_bash_for_danger_agent
        input:
          tool: Bash
          agent_permission: danger
          tool_permission: danger
        expect:
          decision: allow

  - id: green_gate_workspace_before_deploy
    description: "Green Gate — Workspace Tests Before Deploy"
    policy_type: green_contract
    rules:
      action_types:
        - deploy
        - merge
      required_level: workspace
    tests:
      - name: blocks_deploy_without_workspace_green
        input:
          action_type: deploy
          green_level: targeted
        expect:
          decision: block

      - name: allows_deploy_with_workspace_green
        input:
          action_type: deploy
          green_level: workspace
        expect:
          decision: allow

  - id: green_gate_package_before_pr
    description: "Green Gate — Package Tests Before PR"
    policy_type: green_contract
    rules:
      action_types:
        - review
        - apply
      required_level: package
    tests:
      - name: warns_pr_without_package_green
        input:
          action_type: review
          green_level: targeted
        expect:
          decision: warn

  - id: branch_freshness_block_stale_deploys
    description: "Branch Freshness — Block Stale Deploys"
    policy_type: branch_freshness
    rules:
      action_types:
        - deploy
        - merge
      max_commits_behind: 0
      freshness:
        - stale
        - diverged
    tests:
      - name: blocks_deploy_from_stale_branch
        input:
          action_type: deploy
          branch_freshness: stale
          commits_behind: 3
        expect:
          decision: block

      - name: allows_deploy_from_fresh_branch
        input:
          action_type: deploy
          branch_freshness: fresh
          commits_behind: 0
        expect:
          decision: allow

  - id: branch_freshness_warn_stale_testing
    description: "Branch Freshness — Warn on Stale Testing"
    policy_type: branch_freshness
    rules:
      action_types:
        - test
        - build
      max_commits_behind: 5
      freshness:
        - stale
    tests:
      - name: warns_test_on_stale_branch
        input:
          action_type: test
          branch_freshness: stale
          commits_behind: 8
        expect:
          decision: warn

      - name: allows_test_within_threshold
        input:
          action_type: test
          branch_freshness: stale
          commits_behind: 3
        expect:
          decision: allow
