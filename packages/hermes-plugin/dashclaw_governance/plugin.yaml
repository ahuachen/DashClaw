name: dashclaw-governance
version: "0.1.0"
description: "DashClaw governance — every Hermes tool call is policy-gated, optionally human-approved, and recorded as an audit-trail decision in the DashClaw runtime."
author: DashClaw
kind: standalone
requires_env:
  - DASHCLAW_BASE_URL
  - DASHCLAW_API_KEY
hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - on_session_start
  - on_session_end
